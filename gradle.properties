org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx1024m
org.gradle.parallel=true
org.gradle.caching=false

project.build.group=net.runelite
project.build.version=1.13.0
runelite.injected-client.version=1.13.0

glslang.path=
projectx.version=1.0.8
# The plugin API level this client provides, which is NOT the release
# version above. Plugins declare the API level they need with
# @PluginDescriptor(minClientVersion = ...), and the hub catalogue was
# authored against the 1.9-2.6 line it was inherited from. Restarting the
# user-facing version at 1.0.0 must not retroactively make every one of
# those plugins incompatible, so the two numbers are tracked separately:
# bump this only when the plugin API itself actually changes.
projectx.pluginapi.version=2.6.22
projectx.commit.sha=nogit
projectx.repo.url=
projectx.repo.username=
projectx.repo.password=
