# Publishes the client jar that scripts compile against.
#
# Tag-triggered on purpose: pushing to main builds (see CI) but does not cut a
# release. To publish, tag the commit with the version, e.g. `git tag 2.6.22`.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build shaded jar
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          ./gradlew :client:shadowJar -Pprojectx.commit.sha=$COMMIT_SHA

      - name: Name the artifact after the version
        id: artifact
        run: |
          V=$(grep '^projectx.version=' gradle.properties | cut -d= -f2)
          cp runelite-client/build/libs/client-*-shaded.jar "runelite-client/build/libs/projectx-$V.jar"
          echo "jar=runelite-client/build/libs/projectx-$V.jar" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Project X ${{ steps.artifact.outputs.version }}
          files: ${{ steps.artifact.outputs.jar }}
          generate_release_notes: true
